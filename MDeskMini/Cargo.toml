[package]
name = "mdeskmini"
version = "0.2.1"
edition = "2021"
publish = false

[workspace]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hbb_common = { path = "../libs/hbb_common" }
librustdesk = { package = "MDesk", path = "..", features = ["flutter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[build-dependencies]
winres = "0.1"
