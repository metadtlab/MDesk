[package]
name = "mdeskmini"
version = "0.1.2"
edition = "2021"
publish = false

[workspace]

[features]
# Direct Cargo / dedicated Win7 scripts stay software-only. Build scripts select B3 (x64) or B2 (unified x86).
default = []
flutter = ["librustdesk/flutter"]
hwcodec = ["librustdesk/hwcodec"]
vram = ["hwcodec", "librustdesk/vram"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hbb_common = { path = "../libs/hbb_common" }
librustdesk = { package = "MDesk", path = "..", features = ["flutter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[build-dependencies]
winres = "0.1"
